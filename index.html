<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamilyGuy App Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">
            <h2 class="logo">FamilyGuy</h2>
            <button class="btn-outline">Logout</button>
        </header>

        <!-- MAIN CARD -->
        <div class="card">

            <!-- PROFILE SECTION -->
            <div class="profile">
                <div class="avatar">KA</div>
                <div class="profile-info">
                    <h1>Kelvin Amenumey Agbemor</h1>
                    <p>FamilyGuy connects families and makes everyone feel safe and happy.</p>
                </div>
            </div>

            <!-- DIVIDER -->
            <hr class="divider">

            <!-- MEMBERS SECTION -->
            <div class="section">
                <h3 class="section-title">Family Members</h3>
                <div class="members">
                    <span class="badge">Agbesi Amenumey</span>
                    <span class="badge">Derrick Kulego</span>
                    <span class="badge">Martha Dapaah</span>
                </div>
            </div>

            <!-- DIVIDER -->
            <hr class="divider">

            <!-- JOIN SECTION -->
            <div class="section">
                <h3 class="section-title">Join a Family</h3>
                <div class="join-row">
                    <input type="text" id="familyCode" placeholder="Enter family code">
                    <button class="btn-primary">Join Family</button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
